<!DOCTYPE html>
<html lang="en">
<head>
  <!-- skoop-live-runtime -->
  <script src="./skoop-live.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sizzle & Sear Burger Co. Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <header class="header">
            <div class="logo-container">
                <img class="logo" data-bind-src="storefront.logo" src="" alt="Sizzle & Sear Logo">
            </div>
            <div class="branding">
                <h1 class="company-name" data-bind-text="storefront.company_name"></h1>
                <p class="tagline" data-bind-text="storefront.tagline"></p>
            </div>
            <div class="mode-indicator" id="mode-badge">
                <span id="mode-text">Regular Hours</span>
            </div>
        </header>

        <main id="menu-content" class="menu-grid">
            <!-- Categories and products will be injected here -->
        </main>

        <footer class="footer">
            <p>&copy; 2026 Sizzle & Sear Burger Co. | 2 Locations</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
